spring:
  application:
    name: klage-dittnav-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/klage
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  main:
    banner-mode: OFF
  web:
    error:
      include-message: never
      include-stacktrace: never
  flyway:
    enabled: true
    clean-disabled: true
    table: "schema_version"
  servlet:
    multipart:
      #       Size limitations are also handled by app itself to get nice fault messages, but this setting seems to fail faster?
      max-request-size: 50MB
      max-file-size: 50MB
  http:
    codecs:
      max-in-memory-size: 50MB
server:
  port: 7070
  error:
    whitelabel:
      enabled: false
  max-http-request-header-size: 1MB
  jetty:
    connection-idle-timeout: 200s

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

maxAttachmentSize: 50MB
maxTotalSize: 150MB

KLAGE_FILE_API_APP_NAME: klage-file-api

CLAM_AV_URL: http://clamav.nais-system/api/v2/scan

FILE_BASE_URL: http://klage-file-api

KAFKA_TOPIC: klage.privat-klage-mottatt-v1
INTERNAL_EVENT_TOPIC: klage.klage-dittnav-api-internal-events.v1

SERVICE_USER_USERNAME: srvklage-dittnav

KLAGE_DITTNAV_PDF_SERVICE_URL: http://klage-dittnav-pdfgen/api/v1/genpdf/klage-dittnav-pdfgen/

KLAGE_LOOKUP_APP_NAME: klage-lookup
KLAGE_LOOKUP_BASE_URL: http://klage-lookup

logging:
  level:
    root: INFO